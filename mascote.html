<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faceta AI local — Wakasa Hub</title><style>
:root{--bg:#09090b;--panel:#111114;--line:#292930;--text:#f4f1ef;--muted:#92919a;--accent:#c81e2c;--good:#61d58a}*{box-sizing:border-box;margin:0}body{min-height:100vh;background:radial-gradient(circle at 75% 0,#351016,transparent 34%),var(--bg);color:var(--text);font:14px system-ui,sans-serif}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 16px}.brand{font-weight:800;letter-spacing:.08em;margin:0 10px 26px}.brand b{color:var(--accent);font-size:22px;margin-right:8px}.new,.nav a,.settings{display:block;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:11px;text-decoration:none;text-align:left;margin-bottom:7px}.new:hover,.nav a:hover,.nav .active{border-color:var(--accent);background:#251116}.label{color:#6d6c74;font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin:26px 10px 10px}.privacy{position:fixed;bottom:22px;color:var(--muted);font-size:11px;padding:0 10px}.main{display:flex;flex-direction:column}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;color:var(--muted)}.status{color:var(--good)}.status:before{content:'●';margin-right:7px}.settings{width:auto;margin:0}.chat{width:min(820px,90%);height:calc(100vh - 70px);margin:auto;display:flex;flex-direction:column;padding:40px 0 24px}.welcome{text-align:center;margin:auto auto 32px}.avatar{width:72px;height:72px;border:1px solid var(--accent);border-radius:22px;display:grid;place-items:center;margin:auto auto 16px;color:#f04451;font-size:28px;background:#2a1015}.welcome h1{font-size:32px;margin-bottom:8px}.welcome p,.hint{color:var(--muted)}.messages{overflow:auto;display:flex;flex-direction:column;gap:18px;padding:5px}.msg{display:flex;gap:11px;line-height:1.6;max-width:85%}.msg.user{align-self:flex-end;flex-direction:row-reverse}.bubble{padding:12px 15px;border:1px solid var(--line);border-radius:13px;background:var(--panel);white-space:pre-wrap}.user .bubble{background:#291116;border-color:#58222a}.mini{width:28px;height:28px;flex:0 0 28px;border-radius:8px;display:grid;place-items:center;background:#2a1015;color:#f04451;font-size:11px}.user .mini{background:var(--text);color:var(--bg)}.compose{margin-top:24px;display:flex;gap:9px;background:var(--panel);border:1px solid #3a3a42;border-radius:13px;padding:9px}.compose textarea{flex:1;resize:none;outline:0;border:0;background:transparent;color:var(--text);padding:8px}.send{width:40px;height:40px;border:0;border-radius:9px;background:var(--accent);color:white;font-size:18px}.hint{display:flex;justify-content:space-between;font-size:11px;margin-top:8px}@media(max-width:700px){.shell{display:block}.side{display:none}.chat{height:calc(100vh - 70px)}.welcome h1{font-size:26px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><b>✦</b>FACETA AI</div><button class="new" id="new">＋ Nova conversa</button><div class="label">Workspace</div><nav class="nav"><a class="active" href="mascote.html">⌁ Assistente local</a><a href="bots.html">▣ Hospedagem</a><a href="index.html">⌂ Wakasa Hub</a></nav><div class="privacy">Modelo local · sem API paga<br>Pesos em local-agent/.cache</div></aside><main class="main"><header class="top"><span class="status">Modelo local carregado</span><button class="settings" id="health">Verificar conexão</button></header><section class="chat"><div class="welcome" id="welcome"><div class="avatar">✦</div><h1>Faceta local</h1><p>Seu agente open source rodando no próprio computador.</p></div><div class="messages" id="messages"></div><div class="compose"><textarea id="input" rows="1" placeholder="Converse com a Faceta..."></textarea><button class="send" id="send">↑</button></div><div class="hint"><span>Enter envia · Shift + Enter quebra linha</span><span>Local · privado</span></div></section></main></div><script>
const messages=document.querySelector('#messages'),input=document.querySelector('#input');function add(text,who){const e=document.createElement('div');e.className='msg '+who;e.innerHTML='<span class="mini">'+(who==='user'?'Você':'✦')+'</span><div class="bubble"></div>';e.querySelector('.bubble').textContent=text;messages.append(e);messages.scrollTop=messages.scrollHeight}async function send(){const text=input.value.trim();if(!text)return;document.querySelector('#welcome').style.display='none';add(text,'user');input.value='';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text})});const data=await r.json();if(!r.ok)throw Error(data.error);add(data.response,'bot')}catch(e){add('O agente local ainda não está disponível. Execute “npm install”, depois “npm run download:model” e “npm start”.','bot')}}document.querySelector('#send').onclick=send;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};document.querySelector('#new').onclick=()=>{messages.innerHTML='';document.querySelector('#welcome').style.display='block';input.focus()};document.querySelector('#health').onclick=async()=>{try{const r=await fetch('/api/health');const d=await r.json();alert('✓ '+d.model+' está local e pronto.')}catch{alert('Inicie o servidor com npm start.')}};
</script></body></html>
